<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contact</title>
</head>
<body>
    <div class="contact">
        <header>
            <h3>Get in Touch</h3>
            <h1>Contact</h1>
            <div class="contact-info">
                <p class="text">If you have any questions or would like to discuss a project, feel free to reach out</p>
                <p class="details">Phone: <a href="#">+1234567890</a></p>
                <p class="details">Email: <a href="#">email@example.com</a></p>    
            </div>
        </header>
        <div class="contact-form">
            <form autocomplete="off">
                <label for="name" id="name">Name</label>
                <input type="text" id="name" name="user_identifier" required><br>
                <label for="" id="email">Email</label>
                <input type="email" id="email" name="email" required><br>
                <label for="msg">Message</label>
                <textarea name="msg" id="msg" rows="5" required></textarea>
            </form>
            <div class="button">
                <button type="submit">SEND</button>
            </div>
        </div>
    </div>
</body>
</html>
