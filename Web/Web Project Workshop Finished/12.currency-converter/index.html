<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <title>Currency Converter</title>
</head>
<body>
    <div class="currency-converter">
        <h2>Currency Converter</h2>
        <p class="subtitle">The most accurate source of data. Powered by <span class="provider">PLACEHOLDER</span></p>
        <div class="currency-row">
            <div class="currency-column column">
                <label for="sourceCurrency">From:</label>
                <select id="sourceCurrency">
                    <option value="USD">USD</option>
                    <option value="GBP">GBP</option>
                    <option value="EUR">EUR</option>
                    <option value="JPY">JPY</option>
                    <option value="AUD">AUD</option>
                </select>
            </div>
            <div class="currency-column column">
                <label for="targetCurrency">To:</label>
                <select id="targetCurrency">
                    <option value="USD">USD</option>
                    <option value="GBP">GBP</option>
                    <option value="EUR">EUR</option>
                    <option value="JPY">JPY</option>
                    <option value="AUD">AUD</option>
                </select>
            </div>
        </div>
        <div class="amount-row">
            <div class="amount-column column">
                <label for="amount">Amount:</label>
                <input type="number" id="amount" placeholder="Enter amount"> 
            </div>
            <div class="converted-column column">
                <label for="convertedAmount">Converted Amount</label>
                <input type="text" id="convertedAmount" placeholder="Converted Amount">
            </div>
        </div>
        <button class="convert-button">Convert</button>
    </div>
</body>
</html>
