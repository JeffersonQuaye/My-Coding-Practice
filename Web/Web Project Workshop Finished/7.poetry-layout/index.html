<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poetry Layout</title>
</head>
<body>
    <div class="poetry-card">
        <h1 class="poetry-title">Fire and Ice</h1>
        <h2>by Robert Frost</h2>
        <div class="poetry-content">
            <p>Some say the world will end in fire,</p>
            <p>Some say in ice.</p>
            <p>From what I've tasted of desire</p>
            <p>I hold with those who favor fire.</p><br><br>
            <p>But if it had to perish twice,</p>
            <p>I think I know enough of hate</p>
            <p>To say that for destruction ice</p>
            <p>Is also great</p>
            <p>And would suffice</p>
        </div>
    </div>
</body>
</html>
