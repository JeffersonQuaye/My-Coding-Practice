<!DOCTYPE html>
<html>
	<head>		
		<title>CSS Examples</title>
		<style>
			a {
				text-decoration: none;
			}
			a:link {
				color: red;
			}
			a:visited {
				color: gray;
			}
			a:hover {
				color: pink;
			}
			a:active {
				color: green;
			}
		</style>
	</head>
	<body>
		<a href="https://www.udemy.com">Click Here For Udemy</a>
	</body>
</html>
