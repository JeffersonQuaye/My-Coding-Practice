<!DOCTYPE html>
<html>
	<head>		
		<title>CSS Examples</title>
		<style>
			div {
				width: 300px;
				height: 100px;
				background-color: red;
				border: 1px solid black;
			}

			div#mydiv {
				transform: rotateZ(150deg);
			}
		</style>
	</head>
	<body>
		<div>This is box 1</div>
		<p>Rotate X-axis</p>
		<div id="mydiv">This is  box 2</div>
	</body>
</html>
