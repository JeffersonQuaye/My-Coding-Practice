<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Practice</title>
        <link rel="stylesheet" href="styles.css">
        <style>
            ul {
                margin: 0;
                padding: 0;
                overflow: hidden;
                list-style-type: none;
                background-color: blue;
            }
            
            li {
                float: left;
            }
            
            li a {
                display: block;
                color: white;
                text-decoration: none;
                padding: 16px;
                text-align: center;
            }
            
            li a:hover {
                background-color: white;
                color: black;
            }
            
            .myclass {
                color: red;
                font-size: 20px;
            }
        </style>
    </head>
    <body>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <p class="myclass">this is a classed paragraph</p>
    </body>
</html>
