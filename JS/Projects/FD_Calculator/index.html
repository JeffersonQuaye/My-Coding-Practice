<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FD Calculator</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>
    <div class="container">
        <h1>FD CALCULATOR</h1>
        <div class="form-group">
            <label for="principle">Principle</label>
            <input type="number" id="principle" placeholder="Enter the Principle amount">
        </div>
        <div class="form-group">
            <label for="rate">Interest Rate</label>
            <input type="number" id="rate" placeholder="Enter the annual intrest">
        </div>
        <div class="form-group">
            <label for="time">Number of Years</label>
            <input type="number" id="time" placeholder="Enter the number of years">
        </div>
        <button class="calculate-btn" id="calculateBtn">Calculate</button>
        <p id="result" class="result">Maturity Amount</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
